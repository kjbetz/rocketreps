name: Staging Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rocketreps-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push rocketreps-web (:staging, :sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: RocketReps.Web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-migration-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore rocketreps.slnx

      - name: Restore web project for linux-x64 bundle
        run: dotnet restore RocketReps.Web/RocketReps.Web.csproj --runtime linux-x64

      - name: Restore local dotnet tools
        run: dotnet tool restore

      - name: Build staging EF migration bundle
        env:
          ConnectionStrings__rocketreps: Host=localhost;Port=5432;Database=rocketreps;Username=postgres;Password=postgres
        run: |
          mkdir -p artifacts
          dotnet tool run dotnet-ef migrations bundle \
            --project RocketReps.Web \
            --startup-project RocketReps.Web \
            --self-contained \
            --runtime linux-x64 \
            --output artifacts/rocketreps-efbundle

      - uses: actions/upload-artifact@v4
        with:
          name: rocketreps-efbundle-linux-x64
          path: artifacts/rocketreps-efbundle
          if-no-files-found: error

  deploy-staging:
    needs: [build-and-push, build-migration-bundle]
    runs-on: [self-hosted, linux, rocketreps-vps]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rocketreps-efbundle-linux-x64
          path: artifacts

      - name: Apply staging EF migration bundle
        shell: bash
        env:
          STAGING_WEB_ENV_FILE: ${{ vars.STAGING_WEB_ENV_FILE }}
          STAGING_PODMAN_NETWORK: ${{ vars.STAGING_PODMAN_NETWORK }}
          STAGING_MIGRATION_CONTAINER_IMAGE: ${{ vars.STAGING_MIGRATION_CONTAINER_IMAGE }}
        run: |
          set -euo pipefail
          web_env_file="$STAGING_WEB_ENV_FILE"
          podman_network="$STAGING_PODMAN_NETWORK"
          migration_container_image="$STAGING_MIGRATION_CONTAINER_IMAGE"

          if [ -z "$web_env_file" ]; then
            web_env_file="/etc/rocketreps/rocketreps-staging-web.env"
          fi

          apply_args=(
            --env-file "$web_env_file"
            --bundle-path "artifacts/rocketreps-efbundle"
          )

          if [ -n "$podman_network" ]; then
            apply_args+=(--podman-network "$podman_network")
          fi

          if [ -n "$migration_container_image" ]; then
            apply_args+=(--container-image "$migration_container_image")
          fi

          bash scripts/ci/apply-ef-bundle.sh "${apply_args[@]}"

      - name: Run podman auto-update (staging)
        shell: bash
        env:
          AUTO_UPDATE_MAX_ATTEMPTS: 5
          AUTO_UPDATE_INITIAL_DELAY_SECONDS: 15
        run: |
          set -euo pipefail

          max_attempts="${AUTO_UPDATE_MAX_ATTEMPTS:-5}"
          delay_seconds="${AUTO_UPDATE_INITIAL_DELAY_SECONDS:-15}"
          attempt=1

          while true; do
            if podman auto-update --dry-run && podman auto-update; then
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "podman auto-update failed after $attempt attempts." >&2
              exit 1
            fi

            echo "podman auto-update failed on attempt $attempt/$max_attempts. Retrying in ${delay_seconds}s..." >&2
            sleep "$delay_seconds"
            attempt=$((attempt + 1))
            delay_seconds=$((delay_seconds * 2))
          done
